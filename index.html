<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estrellitas del Saber</title>
  <link rel="icon" type="image/png" href="./img/personajes/starly/starly2.webp">


  <!-- Estilos -->
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/index.css">
</head>

<body>

  <main class="inicio">

    <!-- Fondo espacial -->
    <div class="inicio-estrellas" aria-hidden="true"></div>
    <!-- Planetas decorativos -->
    <div class="inicio-planetas" aria-hidden="true">
      <div class="inicio-planeta planeta-morado"></div>
      <div class="inicio-planeta planeta-celeste"></div>
    </div>

    <!-- Estrellas fugaces -->
    <div class="inicio-fugaces" aria-hidden="true">
      <span class="estrella-fugaz"></span>
      <span class="estrella-fugaz"></span>
      <span class="estrella-fugaz"></span>
    </div>

    <!-- Contenido principal -->
    <section class="inicio-contenido">

      <!-- Personaje Starly -->
      <div class="inicio-personaje">
        <img src="./img/personajes/otros/logostarly.png" alt="Starly en su nave espacial" class="inicio-starly">
      </div>

      <!-- Descripción -->
      <p class="inicio-descripcion">
        ¡Pequeñas estrellas, grandes derechos!
      </p>


      <!-- Botón de inicio -->
      <div class="inicio-acciones">

        <button type="button" id="btn-despegar" class="inicio-boton-jugar">
          ¡Despegar! 🚀
        </button>

      </div>


    </section>

  </main>

  <!-- JavaScript -->
  <script src="./js/main.js" defer></script>

</body>

</html>
