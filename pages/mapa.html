<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#87DDF5">

    <title>Estrellitas del Saber | Misiones</title>
    <link rel="icon" type="image/png" href="../img/personajes/starly/starly2.webp">

    <script>
        try {
            if (sessionStorage.getItem("estrellitas_transicion_mapa") === "1") {
                document.documentElement.classList.add("entrada-polvo");
            }
        } catch (error) {
            // La entrada continúa normalmente.
        }
    </script>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/mapa.css">

    <script src="../js/mapa.js" defer></script>
</head>

<body>
    <!-- AVISO DE ORIENTACIÓN MÓVIL -->
    <div class="aviso-horizontal">
        <div class="aviso-horizontal-contenido">
            <img src="../img/personajes/starly/starly_explorador.webp" alt="Starly" class="aviso-horizontal-starly">

            <div class="aviso-horizontal-telefono">📱</div>

            <h2>¡Gira tu teléfono!</h2>
        </div>
    </div>
    <main class="mapa">

        <!-- ENCABEZADO -->
        <header class="mapa-encabezado">

            <a href="../index.html" class="boton-regresar" aria-label="Regresar al inicio">
                <span aria-hidden="true">⌂</span>
                <span>Inicio</span>
            </a>

            <div class="mapa-titulo">
                <h1>La Escuela de las Estrellas</h1>
            </div>

            <div class="mapa-controles">


                <!-- MEDALLAS -->
                <div class="mapa-medallas" aria-label="Reconocimientos conseguidos">
                    <button class="mapa-medalla" type="button" data-premio="1" aria-label="Pequeño Explorador bloqueado"
                        disabled>🏅</button>
                    <button class="mapa-medalla" type="button" data-premio="2" aria-label="Guardián del Saber bloqueado"
                        disabled>🏆</button>
                    <button class="mapa-medalla" type="button" data-premio="3" aria-label="Estrella del Saber bloqueada"
                        disabled>🌟</button>
                </div>


                <div class="contador-estrellas" aria-label="Estrellas conseguidas">
                    <span aria-hidden="true">⭐</span>
                    <span id="total-estrellas">0</span>
                    <span class="contador-maximo">/ 18</span>
                </div>

                <button class="boton-configuracion" id="btn-configuracion" type="button"
                    aria-label="Abrir configuración" aria-haspopup="dialog" aria-controls="modal-configuracion">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 .4 1.7 1.7 0 0 0-1 .4l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 11 5.6a1.7 1.7 0 0 0 .6-1.3V3h2.8v1.3A1.7 1.7 0 0 0 16 5.6a1.7 1.7 0 0 0 1-.4l.06-.06 1.86 1.86-.06.06A1.7 1.7 0 0 0 18.4 9a1.7 1.7 0 0 0 1.7 1.6h.9v2.8h-.9A1.7 1.7 0 0 0 19.4 15Z"
                            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                        <circle cx="13" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                    </svg>
                </button>

            </div>
        </header>

        <!-- PAISAJE -->
        <div class="mapa-paisaje" aria-hidden="true">
            <div class="sol"></div>

            <div class="nube nube-1"></div>
            <div class="nube nube-2"></div>
            <div class="nube nube-3"></div>

            <div class="montana montana-1"></div>
            <div class="montana montana-2"></div>
            <div class="montana montana-3"></div>

            <div class="colina colina-1"></div>
            <div class="colina colina-2"></div>
        </div>

        <!-- MAPA DE MISIONES -->
        <div class="mapa-desplazamiento" id="mapa-desplazamiento">

            <section class="mapa-aventura" id="mapa-aventura" aria-label="Mapa de misiones">

                <!-- ESCUELA -->
                <div class="escuela" aria-hidden="true">
                    <div class="escuela-techo"></div>

                    <div class="escuela-edificio">
                        <div class="escuela-letrero">MI ESCUELA</div>

                        <div class="escuela-ventanas">
                            <span></span>
                            <span></span>
                        </div>

                        <div class="escuela-puerta"></div>
                    </div>
                </div>

                <!-- CAMINO -->
                <svg class="camino-misiones" viewBox="0 0 1000 510" preserveAspectRatio="none" aria-hidden="true">
                    <path class="camino-borde" d="M 173 398
                           C 245 398, 280 332, 383 332
                           S 770 357, 763 296
                           S 365 297, 323 179
                           S 770 212, 733 117
                           S 580 72, 473 45" />

                    <path class="camino-centro" d="M 173 398
                           C 245 398, 280 332, 383 332
                           S 770 357, 763 296
                           S 365 297, 323 179
                           S 770 212, 733 117
                           S 580 72, 473 45" />
                </svg>

                <!-- MISIÓN 1 -->
                <button class="mision mision-1 mision-disponible" type="button" data-mision="1" aria-label="Misión 1">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">1</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true" hidden>🔒</span>
                </button>

                <!-- MISIÓN 2 -->
                <button class="mision mision-2 mision-bloqueada" type="button" data-mision="2" disabled
                    aria-label="Misión 2 bloqueada">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">2</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true">🔒</span>
                </button>

                <!-- MISIÓN 3 -->
                <button class="mision mision-3 mision-bloqueada" type="button" data-mision="3" disabled
                    aria-label="Misión 3 bloqueada">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">3</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true">🔒</span>
                </button>

                <!-- MISIÓN 4 -->
                <button class="mision mision-4 mision-bloqueada" type="button" data-mision="4" disabled
                    aria-label="Misión 4 bloqueada">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">4</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true">🔒</span>
                </button>

                <!-- MISIÓN 5 -->
                <button class="mision mision-5 mision-bloqueada" type="button" data-mision="5" disabled
                    aria-label="Misión 5 bloqueada">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">5</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true">🔒</span>
                </button>

                <!-- MISIÓN 6 -->
                <button class="mision mision-6 mision-bloqueada" type="button" data-mision="6" disabled
                    aria-label="Misión 6 bloqueada">
                    <span class="mision-icono" aria-hidden="true"></span>
                    <span class="mision-numero">6</span>
                    <span class="mision-etiqueta"></span>
                    <span class="mision-estrellas" aria-hidden="true">☆ ☆ ☆</span>
                    <span class="mision-candado" aria-hidden="true">🔒</span>
                </button>

                <!-- STARLY -->
                <div class="starly-posicion" id="starly-posicion" aria-hidden="true">
                    <img src="../img/personajes/starly/starly_explorador.webp" alt="" class="starly-personaje">

                    <span class="starly-flecha">➜</span>
                </div>

                <!-- DECORACIONES -->
                <div class="decoracion-suelo" aria-hidden="true">
                    <span class="flor flor-1">🌼</span>
                    <span class="flor flor-2">🌸</span>
                    <span class="flor flor-3">🌼</span>

                    <span class="arbol arbol-1">🌳</span>
                    <span class="arbol arbol-2">🌳</span>
                </div>

            </section>
        </div>

        <!-- CONFIGURACIÓN -->
        <div class="modal-fondo" id="modal-configuracion" hidden>

            <section class="modal-contenido modal-configuracion" role="dialog" aria-modal="true"
                aria-labelledby="configuracion-titulo" tabindex="-1">

                <button class="modal-cerrar" id="configuracion-cerrar" type="button"
                    aria-label="Cerrar configuración">×</button>

                <div class="configuracion-icono" aria-hidden="true">⚙️</div>

                <h2 id="configuracion-titulo">Configuración</h2>

                <p class="configuracion-subtitulo">
                    Ajusta los sonidos de tu aventura.
                </p>

                <div class="configuracion-opciones">

                    <label class="configuracion-opcion">
                        <span class="opcion-nombre">
                            <span aria-hidden="true">🎵</span>
                            Música
                        </span>

                        <input type="checkbox" id="config-musica" checked>
                        <span class="interruptor" aria-hidden="true"></span>
                    </label>

                    <label class="configuracion-opcion">
                        <span class="opcion-nombre">
                            <span aria-hidden="true">✨</span>
                            Efectos
                        </span>

                        <input type="checkbox" id="config-efectos" checked>
                        <span class="interruptor" aria-hidden="true"></span>
                    </label>

                    <label class="configuracion-opcion">
                        <span class="opcion-nombre">
                            <span aria-hidden="true">🔊</span>
                            Voz de Starly
                        </span>

                        <input type="checkbox" id="config-voz" checked>
                        <span class="interruptor" aria-hidden="true"></span>
                    </label>

                </div>

                <button class="boton-comenzar" id="configuracion-listo" type="button">
                    ¡Listo! ⭐
                </button>

            </section>
        </div>

        <!-- RECONOCIMIENTO -->
        <div class="modal-fondo" id="modal-premio" hidden>
            <section class="modal-contenido premio-contenido" role="dialog" aria-modal="true"
                aria-labelledby="premio-titulo" tabindex="-1">
                <div class="premio-decoraciones" aria-hidden="true">
                    <span>⭐</span>
                    <span>✨</span>
                    <span>⭐</span>
                    <span>✨</span>
                    <span>⭐</span>
                    <span>✨</span>
                </div>


                <h2 class="premio-felicitacion">¡GANASTE UNA MEDALLA!</h2>


                <div class="premio-personajes">
                    <span id="premio-medalla" class="premio-medalla-grande" aria-hidden="true">🏅</span>
                    <img src="../img/personajes/starly/starly_corona.webp" alt="Starly celebrando con su corona"
                        class="premio-starly">


                </div>

                <h3 id="premio-titulo" class="premio-nombre"></h3>

                <p id="premio-descripcion" class="premio-descripcion" hidden></p>

                <button class="boton-comenzar premio-boton" id="premio-continuar" type="button">
                    ¡CONTINUAR!
                </button>
            </section>
        </div>


        <!-- TRANSICIÓN -->
        <div class="transicion-polvo" id="transicion-polvo" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>
</body>

</html>
