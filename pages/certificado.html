<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado | Estrellitas del Saber</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/certificado.css">
    <script src="../js/certificado.js" defer></script>
</head>
<body class="cer-pagina">
    <main class="cer-escena" id="cer-escena">

        <!-- Fondo: de día para el certificado, de noche para el viaje -->
        <div class="cer-cielo"></div>
        <div class="cer-rayos" id="cer-rayos"></div>
        <div class="cer-noche"></div>
        <div class="cer-globos" id="cer-globos"></div>
        <div class="cer-estrellas" id="cer-estrellas"></div>
        <span class="cer-planeta p1"></span>
        <span class="cer-planeta p2"></span>

        <!-- Starly -->
        <div class="cer-guia" id="cer-guia">
            <img
                src="../img/personajes/starly/starly_globos.webp"
                alt="Starly"
                class="cer-starly"
                id="cer-starly"
            >

            <div class="cer-dialogo">
                <p id="cer-mensaje" aria-live="polite">¡Ganaste el certificado final!</p>

                <button type="button" id="cer-audio" class="cer-audio" aria-label="Escuchar a Starly">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                        <path d="M16 9a5 5 0 0 1 0 6M18.5 6a9 9 0 0 1 0 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- El certificado -->
        <div class="cer-zona" id="cer-zona">
            <div class="cer-caja" id="cer-caja">
                <div class="cer-escala">
                    <section class="cer-diploma" id="cer-diploma" aria-label="Certificado Estrellitas del Saber">
                        <div class="cer-marco">
                            <span class="cer-esquina e1">★</span>
                            <span class="cer-esquina e2">★</span>
                            <span class="cer-esquina e3">★</span>
                            <span class="cer-esquina e4">★</span>

                            <div class="cer-cinta"><span>CERTIFICADO</span></div>

                            <h1 class="cer-titulo" id="cer-titulo" aria-label="Estrellitas del Saber"></h1>

                            <div class="cer-ninos" id="cer-ninos"></div>

                            <ol class="cer-sellos" id="cer-sellos" aria-label="Misiones completadas">
                                <li>⭐</li>
                                <li>⭐</li>
                                <li>⭐</li>
                                <li>⭐</li>
                                <li>⭐</li>
                                <li>⭐</li>
                            </ol>

                            <p class="cer-lema">Todos los niños tienen derecho a aprender</p>

                            <button type="button" class="cer-medalla" id="cer-medalla" aria-label="Medalla de estrella">
                                <span class="cer-cintas"><i></i><i></i></span>
                                <span class="cer-disco"><b>⭐</b></span>
                            </button>

                            <span class="cer-brillo" aria-hidden="true"></span>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <!-- El cohete de Starly -->
        <div class="cer-nave-pos" id="cer-nave-pos" hidden>
            <div class="cer-nave" id="cer-nave">
                <img
                    src="../img/personajes/starly/starlycohete.webp"
                    alt="Starly en su cohete"
                    class="cer-cohete"
                    id="cer-cohete"
                    loading="eager"
                    decoding="async"
                >
                <span class="cer-cohete-respaldo" id="cer-cohete-respaldo" hidden aria-hidden="true">🚀</span>
            </div>
        </div>

        <div class="cer-lineas" id="cer-lineas"></div>

        <div class="cer-fugaz" id="cer-fugaz" hidden>
            <span class="cer-cola" id="cer-cola"></span>
            <span class="cer-cabeza">★</span>
        </div>

        <p class="cer-despedida" id="cer-despedida" hidden aria-label="¡Hasta pronto!"></p>

        <!-- Botones finales -->
        <nav class="cer-botones" id="cer-botones" hidden>
            <a href="../index.html" class="cer-boton cer-inicio"><span aria-hidden="true">🏠</span>Inicio</a>
            <a href="mapa.html" class="cer-boton cer-mapa"><span aria-hidden="true">🗺️</span>Mapa</a>
        </nav>

        <div class="cer-efectos" id="cer-efectos"></div>
    </main>
</body>
</html>
