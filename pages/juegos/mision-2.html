<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión | La mochila de Starly</title>
    <link rel="icon" type="image/png" href="../../img/personajes/starly/starly2.webp">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/celebracion.css">
    <link rel="stylesheet" href="../../styles/juegos/mision-2.css">
    <script src="../../js/celebracion.js" defer></script>
    <script src="../../js/juegos/mision-2.js" defer></script>
</head>
<body>
    <main class="mochila-juego">
        <header class="mochila-header">
            <a href="../mapa.html" class="mochila-volver">← Mapa</a>
            <div class="mochila-titulo">
                <span class="mochila-mision">MISIÓN 2</span>
                <h1>¡La mochila de Starly!</h1>
            </div>
            <div class="mochila-contador">⭐ <span id="mochila-total">0</span>/3</div>
        </header>
        <section class="mochila-panel">
            <div class="mochila-escenario" id="mochila-escenario">
                <div class="mochila-pared"></div>
                <div class="mochila-piso"></div>
                <div class="mochila-guia">
                    <img src="../../img/personajes/starly/starly_mate.webp" alt="Starly con lentes" class="mochila-starly" id="mochila-starly">
                    <div class="mochila-dialogo">
                        <p id="mochila-mensaje" aria-live="polite">¡Ya tengo mis útiles para ir a la escuela!</p>
                        <button type="button" id="mochila-audio" class="mochila-audio" aria-label="Escuchar a Starly">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                                <path d="M16 9a5 5 0 0 1 0 6M18.5 6a9 9 0 0 1 0 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="mochila-lista" aria-label="Lista de útiles">
                    <div class="lista-casillas" id="mochila-lista"></div>
                </div>
                <div class="mochila-cosas" id="mochila-cosas"></div>
                <div class="mochila" id="mochila">
                    <div class="mochila-asa"></div>
                    <div class="mochila-cuerpo">
                        <div class="mochila-boca" id="mochila-boca"></div>
                        <div class="mochila-bolsillo"></div>
                        <div class="mochila-cierre"></div>
                    </div>
                    <div class="mochila-solapa"></div>
                    <div class="mochila-emblema">⭐</div>
                </div>
                <div class="mochila-efectos" id="mochila-efectos"></div>
                <div class="mochila-historia" id="mochila-historia" hidden>
                    <div class="historia-utiles" id="historia-utiles"></div>
                    <div class="historia-raton" id="historia-raton">
                        <span class="raton-botin" aria-hidden="true">📚</span>
                        <span class="raton-cuerpo" aria-hidden="true">🐭</span>
                    </div>
                </div>
            </div>
            <div class="mochila-pie">
                <div class="mochila-progreso">
                    <div class="mochila-estrellas">
                        <span class="mochila-estrella">☆</span>
                        <span class="mochila-estrella">☆</span>
                        <span class="mochila-estrella">☆</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
