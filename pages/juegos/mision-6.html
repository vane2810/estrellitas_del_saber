<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 6 | Mi álbum de la escuela</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/celebracion.css">
    <link rel="stylesheet" href="../../styles/juegos/mision-6.css">
    <script src="../../js/celebracion.js" defer></script>
    <script src="../../js/juegos/mision-6.js" defer></script>
</head>
<body>
    <main class="alb-juego">
        <header class="alb-header">
            <a href="../mapa.html" class="alb-volver">← Mapa</a>

            <div class="alb-titulo">
                <span class="alb-mision">MISIÓN 6</span>
                <h1>Mi álbum de la escuela</h1>
            </div>

            <div class="alb-contador">⭐ <span id="alb-total">0</span>/3</div>
        </header>

        <section class="alb-panel">
            <div class="alb-escenario" id="alb-escenario">
                <div class="alb-pared"></div>

                <!-- Starly -->
                <div class="alb-guia">
                    <img
                        src="../../img/personajes/starly/starly_explorador.webp"
                        alt="Starly"
                        class="alb-starly"
                        id="alb-starly"
                    >

                    <div class="alb-dialogo">
                        <p id="alb-mensaje" aria-live="polite">¡Armemos nuestro álbum!</p>

                        <button
                            type="button"
                            id="alb-audio"
                            class="alb-audio"
                            aria-label="Escuchar a Starly"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                                <path d="M16 9a5 5 0 0 1 0 6M18.5 6a9 9 0 0 1 0 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- El álbum abierto -->
                <div class="alb-libro" id="alb-libro">
                    <div class="alb-pag alb-izq">
                        <ol class="alb-minis" id="alb-minis" aria-label="Mi álbum">
                            <li class="alb-mini"><span class="alb-num">1</span></li>
                            <li class="alb-mini"><span class="alb-num">2</span></li>
                            <li class="alb-mini"><span class="alb-num">3</span></li>
                            <li class="alb-mini"><span class="alb-num">4</span></li>
                            <li class="alb-mini"><span class="alb-num">5</span></li>
                        </ol>
                    </div>

                    <div class="alb-lomo" aria-hidden="true"></div>

                    <div class="alb-pag alb-der" id="alb-der">
                        <div class="alb-puntos" id="alb-puntos" aria-hidden="true">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>

                        <div class="alb-cuerpo">
                            <div class="alb-hueco" id="alb-hueco" aria-label="Lugar de la calcomanía">
                                <span class="alb-interrogante" aria-hidden="true">?</span>
                            </div>

                            <span class="alb-flecha" aria-hidden="true">
                                <svg viewBox="0 0 60 40"><path d="M20 6 L6 20 L20 34"></path><path d="M36 6 L22 20 L36 34"></path><path d="M52 6 L38 20 L52 34"></path></svg>
                            </span>

                            <div class="alb-bandeja" id="alb-bandeja" aria-label="Calcomanías"></div>
                        </div>
                    </div>
                </div>

                <!-- La foto final -->
                <div class="alb-foto" id="alb-foto" hidden>
                    <div class="alb-polaroid" id="alb-polaroid">
                        <span class="alb-chinche" aria-hidden="true">📌</span>

                        <div class="alb-foto-img">
                            <span class="fi-sol"></span>
                            <span class="fi-nube fi-nube1"></span>
                            <span class="fi-nube fi-nube2"></span>

                            <span class="fi-escuela">
                                <span class="fi-techo"></span>
                                <span class="fi-cuerpo"><i></i><i class="fi-puerta"></i><i></i></span>
                            </span>

                            <span class="fi-cesped"></span>

                            <span class="fi-globo g1"></span>
                            <span class="fi-globo g2"></span>
                            <span class="fi-globo g3"></span>
                            <span class="fi-globo g4"></span>
                            <span class="fi-globo g5"></span>

                            <div class="fi-ninos" id="alb-foto-ninos"></div>

                            <span class="fi-brillo b1">✦</span>
                            <span class="fi-brillo b2">✦</span>
                            <span class="fi-brillo b3">✦</span>
                            <span class="fi-brillo b4">✦</span>
                            <span class="fi-brillo b5">✦</span>
                            <span class="fi-brillo b6">✦</span>
                        </div>
                    </div>
                </div>

                <span class="alb-mano" id="alb-mano" hidden aria-hidden="true">👆</span>
                <div class="alb-flash" id="alb-flash"></div>

                <div class="alb-efectos" id="alb-efectos"></div>
            </div>

            <div class="alb-pie">
                <div class="alb-progreso">
                    <div class="alb-estrellas">
                        <span class="alb-estrella">☆</span>
                        <span class="alb-estrella">☆</span>
                        <span class="alb-estrella">☆</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
