<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 3 | La ruta escolar</title>
    <link rel="icon" type="image/png" href="../../img/personajes/starly/starly2.webp">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/celebracion.css">
    <link rel="stylesheet" href="../../styles/juegos/mision-3.css">
    <script src="../../js/celebracion.js" defer></script>
    <script src="../../js/juegos/mision-3.js" defer></script>
</head>
<body>
    <main class="ruta-juego">
        <header class="ruta-header">
            <a class="ruta-volver" href="../mapa.html">← Mapa</a>
            <span class="ruta-mision-numero">MISIÓN 3</span>
            <h1>¡La ruta escolar!</h1>
            <div class="ruta-contador">⭐ <span id="ruta-total">0</span>/3</div>
        </header>

        <section class="ruta-panel">
            <div class="ruta-escenario" id="ruta-escenario">
                <div class="ruta-cielo"></div>
                <div class="ruta-sol"></div>
                <div class="ruta-nube nube-uno"></div>
                <div class="ruta-nube nube-dos"></div>
                <div class="ruta-colinas"></div>
                <div class="ruta-cesped"></div>

                <div class="ruta-decoracion" id="ruta-decoracion">
                    <div class="ruta-arbol arbol-uno">
                        <span class="arbol-copa"></span>
                        <span class="arbol-tronco"></span>
                    </div>
                    <div class="ruta-casa casa-uno">
                        <span class="casa-techo"></span>
                        <span class="casa-cuerpo"></span>
                    </div>
                    <div class="ruta-arbol arbol-dos">
                        <span class="arbol-copa"></span>
                        <span class="arbol-tronco"></span>
                    </div>
                </div>

                <div class="ruta-guia">
                    <img
                        class="ruta-starly"
                        src="../../img/personajes/starly/starly_gorro.webp"
                        alt="Starly"
                    >
                    <div class="ruta-dialogo">
                        <p id="ruta-mensaje" aria-live="polite">
                            ¡Vamos a la escuela!
                        </p>
                    </div>
                    <button
                        class="ruta-audio"
                        id="ruta-audio"
                        type="button"
                        aria-label="Escuchar a Starly"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                            <path d="M16 9a5 5 0 0 1 0 6"></path>
                            <path d="M18.5 6a9 9 0 0 1 0 12"></path>
                        </svg>
                    </button>
                </div>

                <div class="ruta-recorrido" id="ruta-recorrido" hidden>
                    <svg
                        id="ruta-svg"
                        viewBox="0 0 700 230"
                        preserveAspectRatio="xMidYMid meet"
                        aria-label="Camino para llegar hasta nuestro compañero"
                    >
                        <path id="ruta-camino-fondo"></path>
                        <path id="ruta-camino-guia"></path>
                        <path id="ruta-camino-hecho"></path>
                        <circle id="ruta-origen" r="24"></circle>
                        <circle id="ruta-destino" r="24"></circle>
                        <circle id="ruta-indicador" r="12"></circle>
                        <circle id="ruta-pista" r="12"></circle>
                    </svg>
                </div>

                <div class="ruta-escuela" id="ruta-escuela" hidden>
                    <div class="escuela-techo"></div>
                    <div class="escuela-cuerpo">
                        <span class="escuela-nombre">MI ESCUELA</span>
                        <div class="escuela-ventanas">
                            <span></span>
                            <span></span>
                        </div>
                        <div class="escuela-puerta"></div>
                    </div>
                </div>

                <div class="ruta-companero" id="ruta-companero" hidden>
                    <span class="companero-emoji" id="companero-emoji" aria-hidden="true"></span>
                    <span class="companero-nombre" id="companero-nombre">Ana</span>
                </div>

                <div class="ruta-carretera">
                    <div class="carretera-lineas"></div>
                </div>

                <div class="ruta-autobus" id="ruta-autobus">
                    <div class="bus-techo"></div>
                    <div class="bus-cuerpo">
                        <div class="bus-ventanas">
                            <div class="bus-ventana bus-conductor">★</div>
                            <div class="bus-ventana" id="bus-ventana-ana"></div>
                            <div class="bus-ventana" id="bus-ventana-luis"></div>
                            <div class="bus-ventana" id="bus-ventana-sol"></div>
                        </div>
                        <div class="bus-franja"></div>
                        <div class="bus-puerta" id="bus-puerta">
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bus-texto">ESCOLAR</div>
                        <div class="bus-luz"></div>
                    </div>
                    <div class="bus-rueda rueda-trasera"></div>
                    <div class="bus-rueda rueda-delantera"></div>
                </div>

                <div class="ruta-efectos" id="ruta-efectos"></div>
            </div>

            <div class="ruta-pie">
                <div class="ruta-estrellas" aria-label="Estrellas obtenidas">
                    <span class="ruta-estrella">☆</span>
                    <span class="ruta-estrella">☆</span>
                    <span class="ruta-estrella">☆</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
